<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Planície Diversões - Entretenimento e diversão. Em breve, um mundo de alegria. Entre em contato conosco.">
    <meta name="author" content="Planície Diversões - EC Locações">
    <meta name="theme-color" content="#0d3188">
    <title>Planície Diversões | Em Desenvolvimento</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b2570 0%, #0d3188 100%);
            color: #fff;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            margin: 2rem auto;
            padding: 1.5rem 1.8rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(1px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.3);
        }

        .logo {
            margin-top: 0.5rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .logo img {
            width: 100%;
            max-width: 320px;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25));
            transition: transform 0.2s ease;
            display: block;
            margin: 0 auto;
        }

        .logo img:hover {
            transform: scale(1.01);
        }

        .logo-fallback {
            display: none;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF9C4, #FFE484);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .desenvolvimento {
            margin-top: 1.8rem;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.25);
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 5px 12px rgba(0,0,0,0.2);
        }

        .titulo {
            margin-top: 2.3rem;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #ffd966;
            display: inline-block;
            padding-bottom: 6px;
        }

        .email {
            margin-top: 1.4rem;
            font-size: 1.3rem;
            background: rgba(255,255,255,0.08);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .email a {
            color: #FFE99C;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .email a:hover {
            color: white;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .telefone {
            margin-top: 1.6rem;
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.7rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.7rem 1rem;
            border-radius: 70px;
            backdrop-filter: blur(2px);
        }

        .telefone-link, .telefone-number {
            color: white;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .telefone-link i {
            font-size: 1.9rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .telefone-number {
            font-size: 1.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: #1f459e;
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }

        .telefone-link:hover i, .telefone-number:hover {
            transform: scale(1.02);
            opacity: 0.9;
            background: #2a52b5;
            text-decoration: none;
        }

        .redes {
            margin-top: 2.8rem;
        }

        .redes h2 {
            font-size: 1.9rem;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .icones {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            flex-wrap: wrap;
        }

        .icone {
            width: 75px;
            height: 75px;
            border: 2.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            text-decoration: none;
            color: white;
            background: rgba(255,255,240,0.05);
            transition: 0.25s ease-in-out;
            backdrop-filter: blur(4px);
        }

        .icone:hover {
            background: #ffcd4a;
            border-color: white;
            color: #0d3188;
            transform: translateY(-5px);
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.4);
        }

        .rodape {
            margin-top: 3rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            line-height: 1.6;
            opacity: 0.8;
            border-top: 1px solid rgba(255,245,180,0.25);
            padding-top: 1.3rem;
            letter-spacing: 0.5px;
        }

        @media (max-width: 520px) {
            .container {
                margin: 1rem;
                padding: 1rem 1.2rem;
            }
            .logo img {
                max-width: 260px;
            }
            .desenvolvimento {
                font-size: 1.4rem;
                padding: 0.3rem 1rem;
            }
            .titulo {
                font-size: 1.4rem;
            }
            .email {
                font-size: 0.9rem;
                padding: 0.4rem 1rem;
                gap: 6px;
                flex-wrap: wrap;
            }
            .telefone {
                font-size: 1.2rem;
                gap: 0.5rem;
                padding: 0.6rem 0.8rem;
            }
            .telefone-number {
                font-size: 1.2rem;
                padding: 0.2rem 0.8rem;
            }
            .telefone-link i {
                font-size: 1.5rem;
            }
            .redes h2 {
                font-size: 1.4rem;
            }
            .icone {
                width: 60px;
                height: 60px;
                font-size: 1.9rem;
                border-radius: 18px;
            }
            .rodape {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .telefone-number {
                font-size: 1rem;
            }
            .logo img {
                max-width: 210px;
            }
        }

        a:focus-visible, .icone:focus-visible, .telefone-link:focus-visible {
            outline: 3px solid #ffcd4a;
            outline-offset: 3px;
            border-radius: 12px;
        }
    </style>
